[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "returnguard-ai"
version = "0.1.0"
description = "Evidence-adaptive refund verification benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "numpy>=1.26,<2.3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "pyarrow>=15,<24",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "lightgbm>=4.3,<5",
  "shap>=0.46,<1",
  "streamlit>=1.40,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<2",
  "pandas-stubs>=2.1",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
returnguard = "returnguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["returnguard"]
ignore_missing_imports = true
